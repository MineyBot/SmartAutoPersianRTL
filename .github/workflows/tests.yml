name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + jsdom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm install --no-save jsdom@26.1.0
      - name: Run test suite
        run: node test/run.js

  # آزمون مرورگری عمداً در CI اجرا نمی‌شود: بارگذاری افزونه‌ی MV3 به یک پنجره‌ی
  # واقعی نیاز دارد و Chrome ≥ ۱۳۷ سوئیچ --load-extension را حذف کرده است.
  # به‌صورت محلی با `npm run test:browser` (روی Edge) اجرایش کنید.
